# Dokploy deployment for our fork. Pasted into Dokploy as a raw compose (same as
# chatwoot): the image is built by .github/workflows/build-image.yml and the
# server only pulls it. Kept in its own file so upstream syncs never conflict.
#
# One container: gateway + s6-supervised dashboard (HERMES_DASHBOARD=1).
# The dashboard is reached through Traefik via a Dokploy domain on port 9119;
# no ports are published on the host. Variables go in Dokploy's Environment tab.
#
# Only hermes-data is backed up (Dokploy volume backup). Re-downloadable
# lazy-installed packages and caches live in their own volumes mounted over
# it, so the daily backup carries just memory, sessions, config and keys.
services:
  cache-perms:
    # New named volumes are root-owned; hermes runs as 10000.
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 10000:10000 /lazy /cache /xdg"]
    restart: "no"
    volumes:
      - hermes-lazy:/lazy
      - hermes-cache:/cache
      - hermes-xdg-cache:/xdg

  hermes:
    image: ghcr.io/pabloluna3596afk/hermes-agent:latest
    pull_policy: always
    restart: unless-stopped
    mem_limit: 2560m # protect the other services on the shared VPS
    depends_on:
      cache-perms:
        condition: service_completed_successfully
    volumes:
      - hermes-data:/opt/data
      - hermes-lazy:/opt/data/lazy-packages
      - hermes-cache:/opt/data/home/.cache
      - hermes-xdg-cache:/opt/data/.cache
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      # Optional OpenAI-compatible API (port 8642). Only enable with a key.
      # - API_SERVER_ENABLED=true
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
    expose:
      - "9119"
    command: ["gateway", "run"]

volumes:
  hermes-data:
  hermes-lazy:
  hermes-cache:
  hermes-xdg-cache:
